name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued runs are skipped in favour of the newest,
# but a run already publishing is left alone: cancelling it half-way would
# leave the site serving a mixture of two builds.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Also turns Pages on, with Actions as its source, the first time this
      # runs. Without it the deploy below fails on any repository where that
      # was never set by hand — a fresh fork, for instance.
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The rulebook PDFs are not in git: assets/rules/sources.json records
      # where each comes from and its SHA-256, and this fails the deploy if any
      # source has changed. Cached by that file, so they are only downloaded
      # again when it changes.
      - name: Cache rulebooks
        uses: actions/cache@v6
        with:
          path: .cache/rules
          key: rules-${{ hashFiles('assets/rules/sources.json') }}

      - name: Fetch rulebooks
        run: npm run rules:fetch

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
